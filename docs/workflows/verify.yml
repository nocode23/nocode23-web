name: Verify website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check pages, assets, downloads and metadata
        run: python3 scripts/verify.py
      - name: Check JavaScript syntax
        run: |
          node --check www/assets/js/main.js
          node --check www/lacto-tracker/assets/js/main.js
          node --check www/daily-routines-and-habits/assets/js/main.js
          node --check www/limits/assets/js/main.js
      - name: Check release ordering and failure isolation
        run: python3 -m unittest discover -s tests
